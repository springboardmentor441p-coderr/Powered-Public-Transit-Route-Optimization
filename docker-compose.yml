version: "3.9"

services:
  routeranker:
    build: .
    container_name: routeranker-app
    ports:
      - "8000:8000"
    environment:
      - ROUTERANKER_PROCESSED_DIR=data/processed
      - ROUTERANKER_ARTIFACTS_DIR=artifacts
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/data/coverage"]
      interval: 30s
      timeout: 10s
      retries: 3

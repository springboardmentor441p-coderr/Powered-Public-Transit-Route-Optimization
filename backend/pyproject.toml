[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "routeranker-backend"
version = "0.1.0"
description = "GTFS ingestion, validation, Parquet preprocessing, and EDA for RouteRanker"
requires-python = ">=3.10"
dependencies = ["polars>=1.0,<2.0", "matplotlib>=3.7,<4.0", "numpy>=1.24,<2.0", "scikit-learn==1.5.0", "joblib>=1.3,<2.0", "fastapi>=0.110,<1.0", "pydantic>=2.0,<3.0", "uvicorn[standard]>=0.27,<1.0"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1.0"]
analytics = ["duckdb>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]


[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "routeranker"
version = "1.0.0"
description = "AI-powered public transit route optimisation (MTA hourly bus ridership)"
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

services:
  database:
    image: postgres:18
    environment:
      POSTGRES_DB: router
      POSTGRES_USER: router
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    volumes:
      - planning_database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U router -d router"]
      interval: 5s
      timeout: 5s
      retries: 20
  application:
    build: .
    environment:
      DATABASE_URL: postgresql://router:${POSTGRES_PASSWORD}@database:5432/router
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./data/processed:/app/data/processed
    command: ["sh", "-c", "python -m backend.import_data && exec python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000"]
volumes:
  planning_database:
